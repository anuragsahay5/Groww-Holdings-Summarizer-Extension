<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #BzFZasRDLg {
            font-family: Arial, Helvetica, sans-serif;
            box-sizing: border-box;
            box-shadow: 0 0 5px 2px rgba(0, 0, 0, 0.25);
            width: fit-content;
            padding: 5px;
            height: 300px;
            overflow-y: scroll;
            scrollbar-width: none;
            color: #44475b;
            margin: 100px auto;
            position: relative;
        }

        #YwaePCFNGQ{
            position: relative;
            border: none;
            background-color: transparent;
            font-weight: 600;
            color: cadetblue;
            opacity: 90%;
        }
        #YwaePCFNGQ:hover{
            opacity: 80%;
            cursor: pointer;
        }
        #YwaePCFNGQ:active{
            opacity: 100%;
            cursor: pointer;
        }

        #BzFZasRDLg th {
            font-weight: 600;
            font-size: 0.9em;
        }
        
        #BzFZasRDLg tbody {
            font-size: 0.9em;
        }

        #BzFZasRDLg tr th,
        #BzFZasRDLg tr td {
            padding: 8px;
        }
        #BzFZasRDLg table tbody tr:not(:last-child) td{
            border-bottom: 1px solid #878787a0;
        }

    </style>
</head>

<body>
    <div id="holdings-panel">
        <div id="holdings-panel-main">
            <div id="BzFZasRDLg">
                <button id="YwaePCFNGQ" >close</button>
                <table cellspacing="0">
                    <thead>
                        <tr>
                            <th style="text-align: left;">Company</th>
                            <th style="text-align: right;">Market Price</th>
                            <th style="text-align: right;">Returns</th>
                            <th style="text-align: right;">Charges</th>
                            <th style="text-align: right;">Net P&L</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td style="text-align: left;" title="IRFC">IRFC</td>
                            <td style="text-align: right;">₹113.64</td>
                            <td style="text-align: right;">₹8867.00</td>
                            <td style="text-align: right;">₹237.75</td>
                            <td style="text-align: right;">₹9103.75</td>
                        </tr>
                        <tr>
                            <td style="text-align: left;" title="Adani Energy Solutions">Adani Energy Solutions</td>
                            <td style="text-align: right;">₹141.80</td>
                            <td style="text-align: right;">₹330.00</td>
                            <td style="text-align: right;">₹87.23</td>
                            <td style="text-align: right;">₹242.77</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>

</html>
